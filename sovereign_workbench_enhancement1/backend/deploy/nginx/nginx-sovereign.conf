# ==============================================================================
# Sovereign On-Premise AI Workbench: Hardened Air-Gap Ingress Reverse Proxy
# Standard: NIST AI RMF 1.0 / OWASP Top 10 for LLMs / Zero-Egress Enforced
# ==============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format sovereign_audit '$remote_addr - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" '
                               '"$http_user_agent" ssl_protocol=$ssl_protocol '
                               'cipher=$ssl_cipher req_time=$request_time';

    access_log  /var/log/nginx/access.log  sovereign_audit;

    # Performance & Timeouts
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate Limiting Zones (DDoS / Brute-force protection)
    limit_req_zone $binary_remote_addr zone=sovereign_api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=sovereign_auth_limit:10m rate=5r/s;

    # Upstream Microservice Definitions
    upstream sovereign_backend {
        server backend:8000;
        keepalive 32;
    }

    upstream sovereign_frontend {
        server frontend:8443;
        keepalive 32;
    }

    # Redirect HTTP to Hardened HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name sovereign-workbench.local;
        return 301 https://$host$request_uri;
    }

    # Primary Sovereign HTTPS Reverse Proxy
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name sovereign-workbench.local;

        # TLS 1.3 & 1.2 Configuration
        ssl_certificate     /etc/ssl/certs/sovereign-workbench.crt;
        ssl_certificate_key /etc/ssl/private/sovereign-workbench.key;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Hardened Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        client_max_body_size 64M;

        # Frontend Route
        location / {
            proxy_pass http://sovereign_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Backend API Ingress Route
        location /api/ {
            limit_req zone=sovereign_api_limit burst=50 nodelay;
            proxy_pass http://sovereign_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }

        # Auth Rate Limiting Route
        location /api/auth/ {
            limit_req zone=sovereign_auth_limit burst=10 nodelay;
            proxy_pass http://sovereign_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Block Direct External Egress Artifacts
        location ~* ^/(openai|anthropic|gemini)/ {
            deny all;
            return 403 "External Cloud AI Egress Denied by Sovereign Ingress Proxy.";
        }
    }
}

